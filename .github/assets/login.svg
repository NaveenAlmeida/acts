<svg xmlns="http://www.w3.org/2000/svg" width="380" height="800" viewBox="0 0 380 800" fill="none" role="img" aria-label="Acts — tela de login">
  <defs>
    <linearGradient id="loginTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E0D4"/>
      <stop offset="1" stop-color="#ECEAE1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="loginScreen"><rect x="22" y="22" width="336" height="756" rx="40"/></clipPath>
  </defs>

  <!-- device bezel -->
  <rect x="10" y="10" width="360" height="780" rx="52" fill="#111114"/>
  <rect x="16" y="16" width="348" height="768" rx="46" fill="none" stroke="#2C2C30" stroke-width="1"/>

  <g clip-path="url(#loginScreen)">
    <rect x="22" y="22" width="336" height="756" fill="#ECEAE1"/>
    <rect x="22" y="22" width="336" height="220" fill="url(#loginTop)"/>

    <!-- status bar -->
    <text x="52" y="60" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1A1A1D">9:41</text>
    <g fill="#1A1A1D">
      <rect x="286" y="52" width="3" height="9" rx="1" opacity="0.45"/>
      <rect x="292" y="49" width="3" height="12" rx="1" opacity="0.65"/>
      <rect x="298" y="46" width="3" height="15" rx="1" opacity="0.85"/>
      <rect x="308" y="50" width="18" height="11" rx="2.5" fill="none" stroke="#1A1A1D" stroke-width="1.2"/>
      <rect x="310.5" y="52.5" width="12" height="6" rx="1" opacity="0.9"/>
    </g>

    <!-- card shadow + card -->
    <rect x="46" y="156" width="288" height="470" rx="34" fill="#000000" opacity="0.05"/>
    <rect x="46" y="150" width="288" height="470" rx="34" fill="#FFFFFF"/>

    <!-- brand badge (community) -->
    <rect x="166" y="182" width="48" height="48" rx="15" fill="#1A1A1D"/>
    <circle cx="185" cy="207" r="8" fill="#ECEAE1"/>
    <circle cx="198" cy="200" r="5.5" fill="#ECEAE1" opacity="0.8"/>

    <!-- wordmark + subtitle -->
    <text x="190" y="278" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="33" font-weight="800" letter-spacing="-1" fill="#1A1A1D">Acts</text>
    <text x="190" y="304" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#6E6E73">Entre para acessar seu ministério</text>

    <!-- e-mail -->
    <text x="74" y="346" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#6E6E73">E-mail</text>
    <rect x="74" y="356" width="232" height="44" rx="22" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1.3"/>
    <text x="92" y="383" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#9A9A9E">voce@suaigreja.com</text>

    <!-- senha -->
    <text x="74" y="424" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#6E6E73">Senha</text>
    <rect x="74" y="434" width="232" height="44" rx="22" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1.3"/>
    <text x="92" y="463" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" letter-spacing="2" fill="#1A1A1D">••••••••••</text>

    <!-- button -->
    <rect x="74" y="500" width="232" height="46" rx="23" fill="#1A1A1D"/>
    <text x="190" y="528" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" fill="#F5F3EC">Entrar</text>

    <!-- links -->
    <text x="190" y="573" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6E6E73" text-decoration="underline">Esqueci minha senha</text>
    <text x="190" y="601" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6E6E73">Não tem conta? <tspan font-weight="700" fill="#1A1A1D">Criar conta</tspan></text>

    <!-- home indicator -->
    <rect x="160" y="748" width="60" height="5" rx="2.5" fill="#1A1A1D" opacity="0.35"/>
  </g>
</svg>
