<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-label="Acts — church management, free for the world">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEECE4"/>
      <stop offset="1" stop-color="#E2DED2"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <!-- soft motifs -->
  <circle cx="1180" cy="40" r="180" fill="#1A1A1D" opacity="0.03"/>
  <circle cx="120" cy="360" r="150" fill="#1A1A1D" opacity="0.03"/>

  <!-- brand badge -->
  <rect x="96" y="92" width="56" height="56" rx="17" fill="#1A1A1D"/>
  <circle cx="118" cy="122" r="9.5" fill="#EEECE4"/>
  <circle cx="133" cy="114" r="6.5" fill="#EEECE4" opacity="0.8"/>

  <!-- wordmark -->
  <text x="168" y="140" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="60" font-weight="800" letter-spacing="-2" fill="#1A1A1D">Acts</text>

  <!-- taglines -->
  <text x="98" y="204" font-family="'Segoe UI',system-ui,sans-serif" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#26262A">Church management, built for the people who serve.</text>
  <text x="98" y="238" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" fill="#6E6E73">Gestão de igreja e equipes de ministério — livre e gratuito, para o mundo inteiro.</text>

  <!-- feature chips -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#4A4A4E">
    <rect x="98"  y="272" width="118" height="30" rx="15" fill="none" stroke="#C9C6BC" stroke-width="1.2"/>
    <text x="157" y="291" text-anchor="middle">Scheduling</text>
    <rect x="226" y="272" width="118" height="30" rx="15" fill="none" stroke="#C9C6BC" stroke-width="1.2"/>
    <text x="285" y="291" text-anchor="middle">Media team</text>
    <rect x="354" y="272" width="118" height="30" rx="15" fill="none" stroke="#C9C6BC" stroke-width="1.2"/>
    <text x="413" y="291" text-anchor="middle">Volunteers</text>
    <rect x="482" y="272" width="150" height="30" rx="15" fill="none" stroke="#C9C6BC" stroke-width="1.2"/>
    <text x="557" y="291" text-anchor="middle">Multi-tenant · RLS</text>
    <rect x="642" y="272" width="66" height="30" rx="15" fill="none" stroke="#C9C6BC" stroke-width="1.2"/>
    <text x="675" y="291" text-anchor="middle">PWA</text>
  </g>
  <text x="98" y="336" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.3" fill="#C08A3E">Open source · MIT · Free forever</text>

  <!-- phone mock (right) -->
  <g>
    <rect x="986" y="44" width="212" height="300" rx="34" fill="#111114"/>
    <rect x="996" y="54" width="192" height="280" rx="26" fill="#ECEAE1"/>
    <!-- mini card -->
    <rect x="1016" y="96" width="152" height="200" rx="22" fill="#FFFFFF"/>
    <rect x="1076" y="118" width="32" height="32" rx="10" fill="#1A1A1D"/>
    <circle cx="1088" cy="134" r="5.5" fill="#ECEAE1"/>
    <circle cx="1096" cy="130" r="3.5" fill="#ECEAE1" opacity="0.8"/>
    <text x="1092" y="176" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" font-weight="800" letter-spacing="-0.5" fill="#1A1A1D">Acts</text>
    <rect x="1032" y="196" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1.2"/>
    <rect x="1032" y="230" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1.2"/>
    <rect x="1032" y="264" width="120" height="26" rx="13" fill="#1A1A1D"/>
    <text x="1092" y="281" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#F5F3EC">Entrar</text>
  </g>
</svg>
