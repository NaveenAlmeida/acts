<svg xmlns="http://www.w3.org/2000/svg" width="380" height="800" viewBox="0 0 380 800" fill="none" role="img" aria-label="Acts — apoiar / donation screen">
  <defs>
    <linearGradient id="donTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E0D4"/>
      <stop offset="1" stop-color="#ECEAE1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="donScreen"><rect x="22" y="22" width="336" height="756" rx="40"/></clipPath>
  </defs>

  <rect x="10" y="10" width="360" height="780" rx="52" fill="#111114"/>
  <rect x="16" y="16" width="348" height="768" rx="46" fill="none" stroke="#2C2C30" stroke-width="1"/>

  <g clip-path="url(#donScreen)">
    <rect x="22" y="22" width="336" height="756" fill="#ECEAE1"/>
    <rect x="22" y="22" width="336" height="220" fill="url(#donTop)"/>

    <!-- status bar -->
    <text x="52" y="60" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1A1A1D">9:41</text>
    <g fill="#1A1A1D">
      <rect x="286" y="52" width="3" height="9" rx="1" opacity="0.45"/>
      <rect x="292" y="49" width="3" height="12" rx="1" opacity="0.65"/>
      <rect x="298" y="46" width="3" height="15" rx="1" opacity="0.85"/>
      <rect x="308" y="50" width="18" height="11" rx="2.5" fill="none" stroke="#1A1A1D" stroke-width="1.2"/>
      <rect x="310.5" y="52.5" width="12" height="6" rx="1" opacity="0.9"/>
    </g>

    <!-- top bar -->
    <path d="M64 96 l-8 6 l8 6" fill="none" stroke="#1A1A1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="107" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1A1A1D">Support · Apoiar</text>

    <!-- hero -->
    <text x="54" y="156" font-family="'Segoe UI',system-ui,sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5" fill="#1A1A1D">Keep every church</text>
    <text x="54" y="187" font-family="'Segoe UI',system-ui,sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5" fill="#1A1A1D">free — forever.</text>
    <rect x="56" y="196" width="104" height="7" rx="3.5" fill="#C08A3E" opacity="0.55"/>
    <text x="54" y="224" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#6E6E73">Sua doação mantém as igrejas menores</text>
    <text x="54" y="242" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#6E6E73">sempre gratuitas — um modelo solidário.</text>

    <!-- impact card -->
    <rect x="46" y="266" width="288" height="140" rx="26" fill="#000000" opacity="0.05"/>
    <rect x="46" y="262" width="288" height="140" rx="26" fill="#FFFFFF"/>
    <text x="70" y="298" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#9A9A9E">YOUR IMPACT · SEU IMPACTO</text>
    <text x="70" y="328" font-family="'Segoe UI',system-ui,sans-serif" font-size="21" font-weight="800" fill="#1A1A1D">R$ 50 <tspan font-size="13" font-weight="600" fill="#6E6E73">/ month</tspan></text>
    <text x="70" y="352" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#6E6E73">keeps 3 small churches online</text>
    <text x="70" y="372" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" fill="#9A9A9E">mantém 3 igrejas pequenas no ar</text>
    <!-- three hearts -->
    <path d="M8 15 C8 15 0.5 10 0.5 5 C0.5 2.4 2.4 0.8 4.6 0.8 C6.1 0.8 7.3 1.7 8 3 C8.7 1.7 9.9 0.8 11.4 0.8 C13.6 0.8 15.5 2.4 15.5 5 C15.5 10 8 15 8 15 Z" transform="translate(250,300)" fill="#C08A3E"/>
    <path d="M8 15 C8 15 0.5 10 0.5 5 C0.5 2.4 2.4 0.8 4.6 0.8 C6.1 0.8 7.3 1.7 8 3 C8.7 1.7 9.9 0.8 11.4 0.8 C13.6 0.8 15.5 2.4 15.5 5 C15.5 10 8 15 8 15 Z" transform="translate(276,300)" fill="#C08A3E"/>
    <path d="M8 15 C8 15 0.5 10 0.5 5 C0.5 2.4 2.4 0.8 4.6 0.8 C6.1 0.8 7.3 1.7 8 3 C8.7 1.7 9.9 0.8 11.4 0.8 C13.6 0.8 15.5 2.4 15.5 5 C15.5 10 8 15 8 15 Z" transform="translate(302,300)" fill="#C08A3E"/>

    <!-- frequency toggle -->
    <rect x="46" y="418" width="288" height="44" rx="22" fill="#E3E0D6"/>
    <rect x="50" y="422" width="140" height="36" rx="18" fill="#FFFFFF"/>
    <text x="120" y="445" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1A1A1D">Monthly</text>
    <text x="262" y="445" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="500" fill="#6E6E73">One-time</text>

    <!-- amount chips -->
    <rect x="46" y="480" width="88" height="52" rx="18" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1.3"/>
    <text x="90" y="512" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#1A1A1D">R$25</text>
    <rect x="146" y="480" width="88" height="52" rx="18" fill="#1A1A1D"/>
    <text x="190" y="512" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#F5F3EC">R$50</text>
    <rect x="246" y="480" width="88" height="52" rx="18" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1.3"/>
    <text x="290" y="512" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#1A1A1D">R$100</text>
    <text x="190" y="552" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#9A9A9E">≈ $9   ·   $18   ·   $36 USD</text>

    <!-- donate button -->
    <rect x="46" y="572" width="288" height="50" rx="25" fill="#1A1A1D"/>
    <text x="190" y="604" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#F5F3EC">Donate · Doar</text>

    <!-- trust footer -->
    <text x="190" y="648" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#6E6E73">100% funds infrastructure · No church ever pays to use Acts.</text>
    <text x="190" y="666" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#9A9A9E">Nenhuma igreja paga para usar o Acts.</text>

    <!-- home indicator -->
    <rect x="160" y="748" width="60" height="5" rx="2.5" fill="#1A1A1D" opacity="0.35"/>
  </g>
</svg>
